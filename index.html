<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키움증권 법인RM팀 | 업체 조회</title><style>
:root{font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif;color:#142449;background:#f7f9fd}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1530px;margin:auto;padding:0 34px 40px}.hero{position:relative;isolation:isolate;padding:42px 12px 52px;min-height:230px;overflow:hidden}.hero:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 84% 20%,#e5eafa 0%,transparent 44%),linear-gradient(115deg,#fff5fb 0%,#f6f9ff 55%,#f0f4ff 100%);border-radius:0 0 24px 24px}.hero:after{content:"";position:absolute;right:12%;top:-110px;width:340px;height:360px;transform:rotate(38deg);border:70px solid #f8cce92f;border-radius:32px;z-index:-1}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.eyebrow{font-weight:800;font-size:17px;color:#54617d;letter-spacing:-.4px}.hero h1{font-size:clamp(31px,4vw,48px);letter-spacing:-1.8px;margin:7px 0 12px;line-height:1.2}.hero h1 span{color:#df0872}.subtitle{color:#64728e;font-size:16px;margin:0}.logo{width:194px;height:auto;object-fit:contain;mix-blend-mode:multiply;flex-shrink:0;margin-top:8px}.search-panel{background:white;border:1px solid #e8eaf2;border-top:2px solid #f49ac7;border-radius:15px;padding:26px;box-shadow:0 12px 30px #152c5510;margin-top:-13px;position:relative}.search-grid{display:grid;grid-template-columns:1fr 1.3fr auto;gap:20px;align-items:end}.field label{display:block;font-weight:800;font-size:16px;margin-bottom:12px;padding-left:13px;border-left:4px solid #e90077}.input-wrap{position:relative}.input-wrap svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#6e7c9b;pointer-events:none}.field input{width:100%;height:55px;border:1px solid #cfd8e9;border-radius:10px;padding:0 15px 0 48px;font-size:15px;color:#142449;outline:0;background:#fff}.field input:focus{border-color:#e90077;box-shadow:0 0 0 3px #e9007718}.field input::placeholder{color:#8995ac}.actions{display:flex;gap:10px}.actions button{border:0;border-radius:10px;height:55px;padding:0 24px;font-weight:800;white-space:nowrap}.primary{background:#e60075;color:#fff}.primary:hover{background:#bf005f}.secondary{background:#e9edf5;color:#253455}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 17px}.meta strong{font-size:18px}.total{color:#6c7891;font-size:14px}.total b{color:#e60075;font-size:17px}.result-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px;gap:15px}.result-title h2{margin:0;border-left:4px solid #e60075;padding-left:12px;font-size:19px}.result-title small{color:#75829b}.tablewrap{overflow:auto;background:#fff;border:1px solid #e1e7f1;border-radius:13px;box-shadow:0 6px 24px #10264b08}table{border-collapse:collapse;min-width:100%;white-space:nowrap;font-size:13px}th{position:sticky;top:0;background:#f1f5fb;text-align:left;color:#334360;padding:16px 18px;border-bottom:1px solid #dfe6f1}td{padding:15px 18px;border-bottom:1px solid #edf0f6;color:#334360}tr:hover td{background:#fff6fb}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}.companycard{background:white;border:1px solid #e2e8f1;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #152c5509}.cardhead{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid #e9edf5}.building{width:45px;height:45px;border-radius:50%;background:#fdeaf4;color:#e60075;display:grid;place-items:center;flex-shrink:0;font-size:24px}.cardhead h3{font-size:18px;margin:0 0 5px;overflow-wrap:anywhere}.groupname{color:#74819a;font-size:13px}.details{display:grid;grid-template-columns:128px 1fr;margin:0}.details dt,.details dd{margin:0;padding:12px 14px;font-size:13px;border-bottom:1px solid #edf1f6;overflow-wrap:anywhere}.details dt{background:#f9fbfe;color:#6d7a93;font-weight:700}.details dd{color:#243453}.details dt:last-of-type,.details dd:last-of-type{border-bottom:0}.empty{background:white;border:1px dashed #d6dfeb;border-radius:13px;padding:56px 20px;text-align:center;color:#7c89a0}.pages{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px 0}.pagebtn{border:0;background:#e8edf5;border-radius:9px;padding:11px 18px;color:#263653}.pagebtn:disabled{opacity:.4;cursor:not-allowed}.notice{font-size:12px;color:#8995aa;margin:30px 0 0;line-height:1.7}.group-pills{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 26px}.pill{border:1px solid #e2e7f0;background:white;color:#34435f;padding:10px 16px;border-radius:10px;font-size:14px}.pill:hover{border-color:#e60075;color:#e60075}.pill:disabled{cursor:not-allowed}.pill.active{background:#fff0f7;border-color:#ee83b6;color:#d8006d}.section-label{font-size:15px;font-weight:800;margin:24px 0 10px}.hidden{display:none!important}@media(max-width:800px){.wrap{padding:0 16px 30px}.hero{padding:30px 4px 46px}.logo{width:124px}.hero h1{font-size:29px}.subtitle{font-size:13px}.search-panel{padding:19px}.search-grid{grid-template-columns:1fr}.actions button{flex:1}.cards{grid-template-columns:1fr}.meta{align-items:flex-start}.details{grid-template-columns:110px 1fr}}

/* 모바일: 단어 단위로 줄바꿈하고 헤더를 간결하게 */
.hero h1{word-break:keep-all;overflow-wrap:normal}.subtitle{word-break:keep-all;line-height:1.65}.hero-top>div{min-width:0}.input-wrap{z-index:5}.input-wrap:focus-within{z-index:20}
.autocomplete{position:absolute;top:calc(100% + 5px);left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid #dbe1eb;border-radius:12px;box-shadow:0 14px 32px #14244926;z-index:30;padding:5px}.autocomplete[hidden]{display:none}.option{width:100%;border:0;background:#fff;text-align:left;padding:12px 13px;border-radius:7px;color:#243453;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}.option:hover,.option.selected{background:#fff0f7;color:#bd005e}.option small{color:#78839b;font-size:11px}.option-empty{padding:12px;color:#7b8497;font-size:13px}.field input{padding-right:14px}td.numeric,.details dd.numeric{text-align:right;font-variant-numeric:tabular-nums}.selection-note{font-size:12px;color:#738098;margin-top:7px;min-height:15px}
@media(max-width:800px){.hero{padding:23px 4px 27px;min-height:0}.hero-top{align-items:flex-start;gap:8px}.hero h1{font-size:clamp(23px,6vw,30px);letter-spacing:-1px;white-space:nowrap}.eyebrow{font-size:12px}.logo{width:clamp(78px,24vw,116px);margin-top:2px}.subtitle{font-size:12px;max-width:260px}.search-panel{margin-top:0}.search-grid{gap:16px}.field label{font-size:14px}.details{grid-template-columns:116px minmax(0,1fr)}.meta{flex-wrap:wrap}}

/* 그룹 조회: 엑셀처럼 그룹명 + 회사명 열 틀 고정 (폭 축소) */
.tablewrap{position:relative;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap th:nth-child(1),.tablewrap td:nth-child(1){position:sticky;left:0;min-width:70px;max-width:70px;width:70px;z-index:3;background:#fff}
.tablewrap th:nth-child(2),.tablewrap td:nth-child(2){position:sticky;left:70px;min-width:127px;max-width:127px;width:127px;z-index:3;background:#fff;box-shadow:3px 0 7px -4px #33436088;white-space:normal;overflow-wrap:anywhere}
.tablewrap th:nth-child(1),.tablewrap th:nth-child(2){z-index:5;background:#f1f5fb}
.tablewrap tbody tr:nth-child(even) td:nth-child(-n+2){background:#fafbfe}
.tablewrap tbody tr:hover td:nth-child(-n+2){background:#fff6fb}
@media(max-width:600px){
.tablewrap th:nth-child(1),.tablewrap td:nth-child(1){min-width:55px;max-width:55px;width:55px;padding:12px 9px;font-size:12px}
.tablewrap th:nth-child(2),.tablewrap td:nth-child(2){left:55px;min-width:100px;max-width:100px;width:100px;padding:12px 10px;font-size:12px}
}
.tablewrap th:nth-child(-n+2),.tablewrap td:nth-child(-n+2){overflow-wrap:anywhere;word-break:break-word;line-height:1.4}.tablewrap th:nth-child(1),.tablewrap th:nth-child(2){z-index:5}

/* 그룹 조회: 표 안에서 상하/좌우 스크롤해도 헤더 및 좌측 2열 고정 */
.tablewrap{max-height:min(70vh,680px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tablewrap thead th{position:sticky;top:0;z-index:6;background:#f1f5fb;box-shadow:0 1px 0 #dfe6f1}
.tablewrap thead th:nth-child(1),.tablewrap thead th:nth-child(2){z-index:9;background:#f1f5fb}
.tablewrap tbody td:nth-child(1),.tablewrap tbody td:nth-child(2){z-index:3}
@media(max-width:600px){.tablewrap{max-height:65vh}}
</style></head><body><main class="wrap"><header class="hero"><div class="hero-top"><div><div class="eyebrow">키움증권 법인RM팀</div><h1><span>업체 조회</span></h1><p class="subtitle">그룹별 기업 현황과 개별 업체 정보를 간편하게 확인하세요.</p></div><img class="logo" src="kiwoom-logo.png" alt="키움증권"></div></header><section class="search-panel"><div class="search-grid"><div class="field"><label for="group">그룹명 조회</label><div class="input-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="group" placeholder="예: 삼성, 현대, LG, SK" autocomplete="off" aria-autocomplete="list"></div></div><div class="field"><label for="company">업체명 또는 사업자번호 조회</label><div class="input-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="company" placeholder="예: 삼성전자 또는 사업자번호 입력" autocomplete="off" aria-autocomplete="list"></div></div><div class="actions"><button class="primary" id="search">조회</button><button class="secondary" id="reset">초기화</button></div></div></section><div class="meta"><strong id="count">검색어를 입력해 주세요</strong><span class="total" id="total"></span></div><section id="suggestions"><div class="section-label">그룹명 빠른 조회</div><div id="pills" class="group-pills"></div></section><section id="result-section" class="hidden"><div class="result-title"><h2 id="result-heading">조회 결과</h2><small id="hint"></small></div><div id="results" aria-live="polite"></div><div class="pages" id="pages"></div></section><p class="notice">자료 기준: 제공된 엑셀 원본 · 공개 GitHub Pages에서는 데이터 파일도 외부에서 열람할 수 있습니다. 내부정보 공개 가능 여부를 확인하세요.</p></main><script src="data.js"></script><script>
const columns=Object.keys(DATA[0]||{}),$=id=>document.getElementById(id);
const norm=s=>String(s??'').toLowerCase().replace(/[\s-]/g,'');
const numericFields=new Set(['종업원 수','당사 이용자','확정급여채무(억)','사외적립자산(억)']);
const roundFields=new Set(['확정급여채무(억)','사외적립자산(억)']);
const numberFmt=new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0});
function formatValue(k,v){if(!numericFields.has(k)||v==null||String(v).trim()==='')return v??'';const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?numberFmt.format(roundFields.has(k)?Math.round(n):n):v}
let shown=[],page=1,selected={group:null,company:null},quickGroup=null;const perPage=50;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
const groupNames=[...new Set(DATA.map(x=>String(x['그룹명']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
const companyItems=[...new Map(DATA.filter(x=>x['회사명']).map(x=>[String(x['회사명'])+'|'+String(x['사업자번호']),{name:String(x['회사명']),biz:String(x['사업자번호']||''),group:String(x['그룹명']||'')}])).values()].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
function setupAutocomplete(id){const input=$(id),drop=el('div',undefined,'autocomplete');drop.hidden=true;drop.setAttribute('role','listbox');input.parentElement.append(drop);let choices=[],active=0;
function close(){drop.hidden=true;drop.replaceChildren()}
function pick(item){quickGroup=null;selected[id]=item;input.value=id==='group'?item:item.name;close();page=1;render()}
function update(){quickGroup=null;selected[id]=null;const q=norm(input.value);drop.replaceChildren();if(!q){close();return}choices=id==='group'?groupNames.filter(s=>norm(s).includes(q)).slice(0,15):companyItems.filter(x=>norm(x.name).includes(q)||norm(x.biz).includes(q)).slice(0,15);active=0;if(!choices.length){drop.append(el('div','일치하는 '+(id==='group'?'그룹':'업체')+'가 없습니다.','option-empty'))}else{choices.forEach((item,i)=>{const btn=el('button',id==='group'?item:item.name,'option'+(i===active?' selected':''));btn.type='button';if(id==='company'){btn.append(el('small',item.biz+(item.group?' · '+item.group:'')))}btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',()=>pick(item));drop.append(btn)})}drop.hidden=false;render()}
input.addEventListener('input',update);input.addEventListener('focus',()=>{if(input.value&&!selected[id])update()});input.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return}if(!drop.hidden&&choices.length&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter'){pick(choices[active]);return}active=(active+(e.key==='ArrowDown'?1:-1)+choices.length)%choices.length;[...drop.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('selected',i===active));drop.querySelectorAll('button')[active]?.scrollIntoView({block:'nearest'});return}if(e.key==='Enter'){page=1;render()}});document.addEventListener('click',e=>{if(!input.parentElement.contains(e.target))close()});return {pick,close}}
const groupAC=setupAutocomplete('group'),companyAC=setupAutocomplete('company');
function render(){const g=$('group').value.trim(),c=$('company').value.trim(),r=$('results');r.replaceChildren();$('pages').replaceChildren();$('total').innerHTML='전체 <b>'+DATA.length.toLocaleString()+'</b>개 업체';$('suggestions').classList.toggle('hidden',!!(g||c));$('result-section').classList.toggle('hidden',!(g||c));if(!g&&!c){$('count').textContent='검색어를 입력해 주세요';return}
if((g&&!selected.group&&!quickGroup)||(c&&!selected.company)){$('count').textContent='검색 목록에서 '+(g&&!selected.group?'그룹명':'업체명')+'을 선택해 주세요';$('result-heading').textContent='검색 항목 선택';$('hint').textContent='입력창 아래의 검색 결과를 선택하세요';r.append(el('div','검색어를 입력한 후 나타나는 목록에서 원하는 항목을 선택해 주세요.','empty'));return}
shown=DATA.filter(x=>(!quickGroup?(!selected.group||String(x['그룹명']||'')===selected.group):norm(x['그룹명']).includes(norm(quickGroup)))&&(!selected.company||(String(x['회사명']||'')===selected.company.name&&String(x['사업자번호']||'')===selected.company.biz)));
const tableMode=!!(selected.group||quickGroup);$('count').textContent='조회 결과 '+shown.length.toLocaleString()+'건';$('result-heading').textContent=tableMode?'그룹명 조회 결과':'업체 조회 결과';$('hint').textContent=tableMode?'가로형 목록 · 좌우로 스크롤':'세로형 상세 카드';if(!shown.length){r.append(el('div','일치하는 업체가 없습니다.','empty'));return}
const subset=shown.slice((page-1)*perPage,page*perPage);if(tableMode){const wrap=el('div',undefined,'tablewrap'),table=el('table'),thead=el('thead'),hr=el('tr'),tbody=el('tbody');columns.forEach(k=>hr.append(el('th',k)));thead.append(hr);subset.forEach(x=>{const tr=el('tr');columns.forEach(k=>tr.append(el('td',formatValue(k,x[k]),numericFields.has(k)?'numeric':'')));tbody.append(tr)});table.append(thead,tbody);wrap.append(table);r.append(wrap)}else{const cards=el('div',undefined,'cards');subset.forEach(x=>{const card=el('article',undefined,'companycard'),head=el('div',undefined,'cardhead'),icon=el('div','▥','building'),headtext=el('div'),title=el('h3',x['회사명']||'업체명 없음'),group=el('div',x['그룹명']||'그룹 미지정','groupname'),dl=el('dl',undefined,'details');headtext.append(title,group);head.append(icon,headtext);columns.filter(k=>k!=='회사명'&&k!=='그룹명').forEach(k=>dl.append(el('dt',k),el('dd',formatValue(k,x[k]),numericFields.has(k)?'numeric':'')));card.append(head,dl);cards.append(card)});r.append(cards)}const total=Math.ceil(shown.length/perPage);if(total>1){const nav=$('pages'),prev=el('button','이전','pagebtn'),next=el('button','다음','pagebtn');prev.disabled=page===1;next.disabled=page===total;prev.onclick=()=>{page--;render();window.scrollTo(0,0)};next.onclick=()=>{page++;render();window.scrollTo(0,0)};nav.append(prev,el('span',page.toLocaleString()+' / '+total.toLocaleString()+' 페이지'),next)}}
$('search').onclick=()=>{page=1;render();if($('group').value&&!selected.group)$('group').focus();else if($('company').value&&!selected.company)$('company').focus()};$('reset').onclick=()=>{quickGroup=null;$('group').value='';$('company').value='';selected={group:null,company:null};groupAC.close();companyAC.close();page=1;render()};
const top20=[
['삼성',['삼성']],['SK',['에스케이','SK']],['현대자동차',['현대자동차']],['LG',['엘지','LG']],
['한화',['한화']],['롯데',['롯데']],['포스코',['포스코','POSCO']],['HD현대',['HD현대','에이치디현대']],
['농협',['농협']],['GS',['지에스','GS']],['신세계',['신세계']],['한진',['한진']],
['KT',['케이티','KT']],['LS',['엘에스','LS']],['CJ',['씨제이','CJ']],['카카오',['카카오']],
['HMM',['에이치엠엠','HMM']],['두산',['두산']],['셀트리온',['셀트리온']],['네이버',['네이버','NAVER']]
];
$('suggestions').querySelector('.section-label').textContent='2026 재계 20대 그룹 빠른 조회';
for(let i=0;i<top20.length;i++){
 const [name,aliases]=top20[i];
 const matches=groupNames.filter(g=>aliases.some(a=>norm(g)===norm(a)));
 const b=el('button',(i+1)+'  '+name,'pill');b.type='button';
 if(!matches.length){b.disabled=true;b.title='원본 엑셀에 해당 그룹명이 없습니다';b.style.opacity='.45'}
 else b.onclick=()=>{selected={group:null,company:null};quickGroup=null;$('group').value=matches[0];$('company').value='';groupAC.close();companyAC.close();selected.group=matches[0];page=1;render();$('result-section').scrollIntoView({behavior:'smooth',block:'start'})};
 $('pills').append(b)
}render();
</script></body></html>
