<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키움증권 법인RM팀 업체 조회 페이지</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#243043;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1380px;margin:42px auto;padding:0 22px}h1{font-size:28px;margin:0 0 8px}.sub{color:#667085;margin:0 0 25px}.panel,.tablewrap,.companycard{background:#fff;border:1px solid #e1e5eb;border-radius:12px;box-shadow:0 3px 14px #15263b08}.panel{padding:24px}.search{display:grid;grid-template-columns:1fr 1.4fr auto;gap:14px;align-items:end}label{display:block;font-weight:650;font-size:14px;margin-bottom:9px}input{width:100%;border:1px solid #cbd3dd;border-radius:8px;padding:13px 14px;font-size:15px;outline:none}input:focus{border-color:#c42535;box-shadow:0 0 0 3px #c4253515}button{background:#b91f2d;border:0;color:white;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer}.reset,.pagebtn{background:#e9edf2;color:#344054}.actions{display:flex;gap:8px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:24px 0 13px;font-size:14px;color:#667085}.meta strong{color:#263348}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;background:#f0f3f7;padding:14px;border-bottom:1px solid #dce2ea;position:sticky;top:0}td{padding:12px 14px;border-bottom:1px solid #eef0f4}tr:hover td{background:#fafbfc}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:16px}.companycard{overflow:hidden}.cardhead{padding:18px 20px;background:#fbfcfe;border-bottom:1px solid #e7ebf0}.cardhead h2{font-size:19px;margin:0 0 5px}.groupname{font-size:12px;color:#b91f2d;font-weight:650}.details{display:grid;grid-template-columns:130px 1fr;margin:0}.details dt,.details dd{margin:0;padding:11px 15px;border-bottom:1px solid #eef1f4;font-size:13px;overflow-wrap:anywhere}.details dt{background:#fafbfc;color:#667085;font-weight:600}.details dd{color:#243043}.details dt:last-of-type,.details dd:last-of-type{border-bottom:0}.empty{padding:48px 20px;text-align:center;color:#778291;background:white;border:1px solid #e1e5eb;border-radius:12px}.pages{display:flex;gap:10px;align-items:center;justify-content:center;margin:20px 0}.pagebtn:disabled{opacity:.45;cursor:not-allowed}.notice{font-size:12px;color:#8a9099;margin-top:24px}@media(max-width:750px){.search{grid-template-columns:1fr}.actions button{flex:1}.wrap{margin:25px auto}h1{font-size:24px}.cards{grid-template-columns:1fr}.meta{align-items:flex-start;flex-direction:column}.details{grid-template-columns:110px 1fr}}
.brandheader{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:8px}.brandheader h1{margin:0}.brandlogo{width:168px;min-width:120px;height:auto;display:block}.brandheader .logoarea{flex-shrink:0}@media(max-width:600px){.brandlogo{width:112px}.brandheader h1{font-size:20px}}
</style></head><body><main class="wrap"><header class="brandheader"><h1>키움증권 법인RM팀 업체 조회 페이지</h1><div class="logoarea" aria-label="키움증권 로고"><img class="brandlogo" src="kiwoom-logo.png" alt="키움증권 KIWOOM SECURITIES"></div></header><p class="sub">그룹은 가로형 목록으로, 개별 업체는 세로형 상세 카드로 조회합니다.</p><section class="panel"><div class="search"><div><label for="group">그룹명 조회</label><input id="group" placeholder="예: 삼성" autocomplete="off"></div><div><label for="company">업체명 또는 사업자번호 조회</label><input id="company" placeholder="업체명 또는 사업자번호" autocomplete="off"></div><div class="actions"><button id="search">조회</button><button class="reset" id="reset">초기화</button></div></div></section><div class="meta"><strong id="count"></strong><span id="hint"></span></div><section id="results" aria-live="polite"></section><div class="pages" id="pages"></div><p class="notice">자료 기준: 제공된 엑셀 원본. GitHub Pages에 공개 게시하면 데이터 파일도 외부에서 열람할 수 있으므로 게시 전 내부정보 공개 가능 여부를 확인하세요.</p></main><script src="data.js"></script><script>
const columns=Object.keys(DATA[0]||{}),$=id=>document.getElementById(id),norm=s=>String(s??'').toLowerCase().replace(/[\s-]/g,'');let shown=[],page=1;const perPage=50;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function render(){const g=norm($('group').value),c=norm($('company').value),r=$('results');r.replaceChildren();$('pages').replaceChildren();if(!g&&!c){$('count').textContent='검색어를 입력해 주세요';$('hint').textContent=`전체 ${DATA.length.toLocaleString()}개 업체`;return}shown=DATA.filter(x=>(!g||norm(x['그룹명']).includes(g))&&(!c||norm(x['회사명']).includes(c)||norm(x['사업자번호']).includes(c)));const tableMode=!!g;$('count').textContent=`조회 결과 ${shown.length.toLocaleString()}건`;$('hint').textContent=tableMode?'그룹 조회 · 가로형 목록':'업체 조회 · 상세 카드';if(!shown.length){r.append(el('div','일치하는 업체가 없습니다.','empty'));return}const subset=shown.slice((page-1)*perPage,page*perPage);if(tableMode){const wrap=el('div',undefined,'tablewrap'),table=el('table'),thead=el('thead'),hr=el('tr'),tbody=el('tbody');columns.forEach(k=>hr.append(el('th',k)));thead.append(hr);subset.forEach(x=>{const tr=el('tr');columns.forEach(k=>tr.append(el('td',x[k]??'')));tbody.append(tr)});table.append(thead,tbody);wrap.append(table);r.append(wrap)}else{const cards=el('div',undefined,'cards');subset.forEach(x=>{const card=el('article',undefined,'companycard'),head=el('div',undefined,'cardhead'),title=el('h2',x['회사명']||'업체명 없음'),group=el('div',x['그룹명']||'그룹 미지정','groupname'),dl=el('dl',undefined,'details');head.append(title,group);columns.filter(k=>k!=='회사명'&&k!=='그룹명').forEach(k=>{dl.append(el('dt',k),el('dd',x[k]??''))});card.append(head,dl);cards.append(card)});r.append(cards)}const total=Math.ceil(shown.length/perPage);if(total>1){const nav=$('pages'),prev=el('button','이전','pagebtn'),next=el('button','다음','pagebtn');prev.disabled=page===1;next.disabled=page===total;prev.onclick=()=>{page--;render();window.scrollTo(0,0)};next.onclick=()=>{page++;render();window.scrollTo(0,0)};nav.append(prev,el('span',`${page.toLocaleString()} / ${total.toLocaleString()} 페이지`),next)}}
$('search').onclick=()=>{page=1;render()};$('reset').onclick=()=>{$('group').value='';$('company').value='';page=1;render()};['group','company'].forEach(id=>{$(id).addEventListener('input',()=>{page=1;render()});$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;render()}})});render();</script></body></html>
